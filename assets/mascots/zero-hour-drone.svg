<svg xmlns="http://www.w3.org/2000/svg" width="360" height="136" viewBox="0 0 360 136" role="img" aria-labelledby="t d">
  <title id="t">Zero Hour drone signal</title>
  <desc id="d">A neon Zero Hour emblem: a detailed teal interceptor drone with panel seams, canopy and wingtip lights, framed by a targeting reticle, over a radar grid with a pink boss core, crystals and mines.</desc>
  <defs>
    <radialGradient id="zh-ambient" cx="50%" cy="64%" r="62%">
      <stop offset="0" stop-color="#0e4a45" stop-opacity=".6"/>
      <stop offset="1" stop-color="#04090f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zh-hull" x1="180" y1="46" x2="180" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d323d"/><stop offset="1" stop-color="#04121a"/>
    </linearGradient>
    <linearGradient id="zh-core" x1="180" y1="64" x2="180" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ff5e8"/><stop offset="1" stop-color="#2de2c6"/>
    </linearGradient>
    <filter id="zh-bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="a"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8.5" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="zh-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="zh-scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.3" fill="#02080c" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="360" height="136" fill="url(#zh-ambient)"/>

  <!-- radar sweep arcs -->
  <g filter="url(#zh-soft)" stroke="#0fae97" fill="none" stroke-linecap="round">
    <path d="M126 100A56 56 0 0 1 234 100" stroke-width="1.4" opacity=".22"/>
    <path d="M108 100A74 74 0 0 1 252 100" stroke-width="1.2" opacity=".15"/>
  </g>

  <!-- perspective signal grid -->
  <g filter="url(#zh-soft)" stroke="#0fae97" fill="none" stroke-linecap="round">
    <path d="M28 124H332" stroke-width="2" opacity=".5"/>
    <path d="M70 110H290" stroke-width="1.6" opacity=".34"/>
    <path d="M104 100H256" stroke-width="1.3" opacity=".2"/>
    <path d="M180 98V126" stroke-width="1.4" opacity=".4"/>
    <path d="M150 99 132 126M210 99 228 126" stroke-width="1.3" opacity=".3"/>
    <path d="M120 100 86 126M240 100 274 126" stroke-width="1.2" opacity=".22"/>
  </g>

  <!-- distant boss core (Core Warden) -->
  <g filter="url(#zh-bloom)" transform="translate(180 27)" stroke-linejoin="round">
    <path d="M0 -17 14.7 -8.5 14.7 8.5 0 17 -14.7 8.5 -14.7 -8.5Z" fill="#1a0a12" stroke="#ff5a78" stroke-width="2.8"/>
    <path d="M0 -10 8.7 -5 8.7 5 0 10 -8.7 5 -8.7 -5Z" fill="none" stroke="#ff5a78" stroke-width="1.6" opacity=".55"/>
    <path d="M-27 -16A31 31 0 0 1 27 -16M27 16A31 31 0 0 1 -27 16" fill="none" stroke="#ff5a78" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
    <path d="M-22 0H-30M22 0H30" stroke="#ff5a78" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <circle r="6" fill="#ffc34d"/>
    <circle r="2.2" fill="#fff7d7"/>
  </g>

  <!-- targeting reticle around the drone -->
  <g filter="url(#zh-soft)" stroke="#2de2c6" stroke-width="2" stroke-linecap="round" fill="none" opacity=".5">
    <path d="M118 58H130M118 58V70"/>
    <path d="M242 58H230M242 58V70"/>
    <path d="M118 118H130M118 118V106"/>
    <path d="M242 118H230M242 118V106"/>
  </g>

  <!-- crystals -->
  <g filter="url(#zh-bloom)" stroke-linejoin="round">
    <g transform="translate(58 82)">
      <path d="M0 -19 15 0 0 19 -15 0Z" fill="#06222a" stroke="#2de2c6" stroke-width="3"/>
      <path d="M0 -11 8 0 0 11 -8 0Z" fill="#2de2c6" opacity=".9"/>
      <path d="M-4 -6 2 -1" stroke="#eafffb" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(302 78)">
      <path d="M0 -16 12 0 0 16 -12 0Z" fill="#2a1c05" stroke="#ffc34d" stroke-width="2.8"/>
      <path d="M0 -9 6 0 0 9 -6 0Z" fill="#ffc34d" opacity=".9"/>
    </g>
  </g>

  <!-- mines -->
  <g filter="url(#zh-bloom)" stroke-linejoin="round">
    <g transform="translate(96 40) rotate(12)">
      <path d="M0 -15 4 -6 14 -10 9 0 14 10 4 6 0 15 -4 6 -14 10 -9 0 -14 -10 -4 -6Z" fill="#1a0610" stroke="#ff5a78" stroke-width="2.4"/>
      <circle r="4.5" fill="#ff5a78"/>
    </g>
    <g transform="translate(266 44) rotate(-16)">
      <path d="M0 -13 3.5 -5 12 -8.5 7.5 0 12 8.5 3.5 5 0 13 -3.5 5 -12 8.5 -7.5 0 -12 -8.5 -3.5 -5Z" fill="#1a0610" stroke="#ff5a78" stroke-width="2.2"/>
      <circle r="4" fill="#ff5a78"/>
    </g>
  </g>

  <!-- hero drone (detailed interceptor) -->
  <g filter="url(#zh-bloom)" stroke-linejoin="round">
    <!-- engine exhaust + afterburner trails (behind hull) -->
    <path d="M170 96 167 113M190 96 193 113" stroke="#2de2c6" stroke-width="3.4" stroke-linecap="round" opacity=".55"/>
    <path d="M150 70C138 80 134 96 138 112M210 70C222 80 226 96 222 112" fill="none" stroke="#0fae97" stroke-width="3.6" stroke-linecap="round" opacity=".6"/>
    <!-- hull -->
    <path d="M180 46 236 110 206 104 180 94 154 104 124 110Z" fill="url(#zh-hull)" stroke="#2de2c6" stroke-width="4.5"/>
    <!-- inner engine core -->
    <path d="M180 66 204 100 180 90 156 100Z" fill="url(#zh-core)" opacity=".92"/>
    <!-- panel seams -->
    <g stroke="#0fae97" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".85">
      <path d="M180 58 152 100M180 58 208 100"/>
      <path d="M168 72 180 65 192 72"/>
    </g>
    <!-- left-edge rim highlight + spine -->
    <path d="M180 50V86" stroke="#9ff5e8" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
    <path d="M178 49 127 108" stroke="#9ff5e8" stroke-width="1.6" stroke-linecap="round" opacity=".4"/>
    <!-- cockpit canopy -->
    <circle cx="180" cy="80" r="9" fill="#eafffb" stroke="#04121a" stroke-width="2.6"/>
    <circle cx="180" cy="80" r="4" fill="#2de2c6"/>
    <path d="M174 78C176 74 184 74 186 78" fill="none" stroke="#04121a" stroke-width="1.3" opacity=".55"/>
    <!-- wingtip lights -->
    <circle cx="234" cy="108" r="3.2" fill="#ffc34d"/>
    <circle cx="126" cy="108" r="3.2" fill="#2de2c6"/>
    <!-- side fins -->
    <path d="M129 84C120 75 120 63 129 54M231 84C240 75 240 63 231 54" fill="none" stroke="#2de2c6" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M144 82C137 74 137 65 144 57M216 82C223 74 223 65 216 57" fill="none" stroke="#9ff5e8" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- sparkles -->
  <g>
    <path d="M40 26 42 32 48 34 42 36 40 42 38 36 32 34 38 32Z" fill="#9ff5e8" opacity=".9"/>
    <circle cx="324" cy="30" r="2.2" fill="#ffc34d"/>
    <circle cx="330" cy="100" r="1.8" fill="#2de2c6"/>
    <circle cx="30" cy="96" r="1.8" fill="#ff5a78"/>
  </g>

  <!-- CRT scanlines -->
  <rect width="360" height="136" fill="url(#zh-scan)" opacity=".4"/>
</svg>
